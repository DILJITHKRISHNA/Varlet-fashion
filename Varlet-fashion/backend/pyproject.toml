[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# B008: FastAPI's Depends()/File() defaults are intentional.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"migrations/*" = ["E501", "UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
